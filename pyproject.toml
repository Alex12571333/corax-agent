[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corax-agent"
version = "0.3.22"
description = "Corax Agent — typed extension runtime with strict tool and infrastructure boundaries."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Corax" }]
keywords = ["agent", "runtime", "cli"]
dependencies = [
    "agent-core>=0.2,<0.3",
    "agent-sdk>=0.2,<0.3",
    "corax-ui>=0.2,<0.3",
]

[project.optional-dependencies]
# YAML config support. The scaffold runs without it (falls back to a
# minimal built-in YAML reader/writer or to JSON config), but PyYAML is
# recommended for full YAML fidelity.
yaml = ["pyyaml>=6.0"]
# Tooling for the test/coverage workflow.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "corax-evals @ git+https://github.com/Alex12571333/corax-evals.git",
]

[project.scripts]
corax = "corax.cli:main"
corax-agent = "corax.cli:main"

[tool.setuptools.packages.find]
include = ["corax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["corax"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
