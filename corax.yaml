agent:
  name: corax
  profile: default
  mode: local
  first_run: true

runtime:
  autostart: false
  log_level: INFO
  workspace_path: ./workspace
  data_path: ./data
  logs_path: ./logs

extensions:
  active:
    tool:
      - echo
      - filesystem
      - editor
      - shell
      - web.search
      - web.fetch
    channel_connector:
      - console.connector
      - telegram.connector
    model_provider:
      - stub
      - llm.local
      - model.router
    memory_provider:
      - memory.none
    policy_provider:
      - security.policy
    runtime_service:
      - gateway
      - memory.loop
      - context.manager
      - mcp.manager
      - skills.runtime
      - hooks.runtime
      - subagents.orchestrator
      - sandbox.executor
    storage_provider:
      - state.file
    observability:
      - observability.jsonl
  bindings:
    planner: stub
    primary_model: model.router
    model_router: model.router
    memory: memory.none
    memory_loop: memory.loop
    policy: security.policy
    state: state.file
    context: context.manager
    mcp: mcp.manager
    skills: skills.runtime
    hooks: hooks.runtime
    subagents: subagents.orchestrator
    sandbox: sandbox.executor
    observability: observability.jsonl
  available:
    stub:
      kind: model_provider
      enabled: true
      description: "Built-in deterministic planner"
    memory.none:
      kind: memory_provider
      enabled: true
      description: "Built-in no-op memory provider"
    memory.uam:
      kind: memory_provider
      enabled: false
      description: "Universal Agent Memory provider"
      path: ../universal-agent-memory/agent-integrations/corax
    memory.mnemonic-vault:
      kind: memory_provider
      enabled: false
      description: "Mnemonic Vault file-first memory provider"
      path: ../mnemonic-vault/integrations/corax
    memory.loop:
      kind: runtime_service
      enabled: true
      description: "Bounded recall and privacy-aware retention loop"
      path: ../corax-memory-loop
    context.manager:
      kind: runtime_service
      enabled: true
      description: "Deterministic bounded context compaction"
      path: ../corax-context-manager
    mcp.manager:
      kind: runtime_service
      enabled: true
      description: "Official-SDK MCP client and tool bridge"
      path: ../corax-mcp-manager
    skills.runtime:
      kind: runtime_service
      enabled: true
      description: "Portable progressive Agent Skills loader"
      path: ../corax-skills-runtime
    hooks.runtime:
      kind: runtime_service
      enabled: true
      description: "Consent-gated subprocess lifecycle hooks"
      path: ../corax-hooks-runtime
    subagents.orchestrator:
      kind: runtime_service
      enabled: true
      description: "Bounded parallel leaf-subagent delegation"
      path: ../corax-subagents
    sandbox.executor:
      kind: runtime_service
      enabled: true
      description: "Fail-closed Seatbelt or Docker shell backend"
      path: ../corax-sandbox-executor
    observability.jsonl:
      kind: observability
      enabled: true
      description: "Privacy-first bounded JSONL execution traces"
      path: ../corax-observability
    state.file:
      kind: storage_provider
      enabled: true
      description: "Atomic local JSON checkpoint storage"
      path: ../corax-state-store
    terminal:
      kind: channel_connector
      enabled: true
      description: "Built-in terminal connector"
    model.router:
      kind: model_provider
      enabled: true
      description: "Provider-agnostic model routing and fallback"
      path: ../corax-model-router
    console.connector:
      kind: channel_connector
      enabled: true
      description: "Interactive local console channel"
      path: ../corax-console
    echo:
      kind: tool
      enabled: true
      description: "Built-in echo tool"
    filesystem:
      kind: tool
      enabled: true
      description: "Workspace-confined filesystem tool"
      path: ../corax-filesystem-capability
    editor:
      kind: tool
      enabled: true
      description: "Workspace-confined text editor tool"
      path: ../corax-editor-capability
    shell:
      kind: tool
      enabled: true
      description: "Guarded local shell command tool"
      path: ../corax-shell-capability
    web.search:
      kind: tool
      enabled: true
      description: "Web search via a self-hosted SearXNG instance"
      path: ../corax-web-search-capability
    web.fetch:
      kind: tool
      enabled: true
      description: "Guarded public-page fetch for grounded citations"
      path: ../corax-web-search-capability/web_fetch
    gateway:
      kind: runtime_service
      enabled: true
      description: "Channel-neutral gateway/session service"
      path: ../corax-gateway-capability
    llm.local:
      kind: model_provider
      enabled: true
      description: "Local Spark model provider (text + optional image/video)"
      path: ../corax-llm-local-connector
    telegram.connector:
      kind: channel_connector
      enabled: true
      description: "Telegram chat connector (streaming, commands, HTML formatting)"
      path: ../corax-telegram-connector
    security.policy:
      kind: policy_provider
      enabled: true
      description: "Three-mode authorization policy"
      path: ../corax-security-policy

security:
  # ask = prompt for guarded work; auto = risk reviewer; full = policy-layer
  # full access (hard denials and tool/OS boundaries remain).
  mode: ask
  blocked_paths:
    - ../corax-core
    - ../corax-sdk
    - ~/.ssh
    - .env

limits:
  max_parallel_tasks: 4
  max_plan_tasks: 30
  max_tasks_per_correlation: 50
  task_timeout_seconds: 60
  max_payload_mb: 20

ui:
  theme: corax-hologram
  mascot: corax
  show_banner: true

llm:
  # Local Spark LLM connector setup. Exported to CORAX_LLM_* at runtime start.
  # Edit here or via the runtime menu (option "L"). Text input is always on;
  # toggle image/video for multimodal input. Spark vLLM server on the GB10.
  base_url: http://192.168.0.10:8000/v1
  model: google/gemma-4-12B-it
  enable_image: false
  enable_video: false

tool_routing:
  # Tool selection uses only the Nemotron embedding service; no routing LLM.
  base_url: http://192.168.0.10:8080/v1
  model: nvidia/Nemotron-3-Embed-1B-NVFP4
  dimension: 2048
  top_k: 6
  max_active_tools: 12
  max_schema_bytes: 32768
  min_similarity: 0.20
  timeout_seconds: 30.0

telegram:
  # Telegram connector setup. Exported to CORAX_TELEGRAM_* at runtime start.
  # Edit here or via the runtime menu (option "T"). The bot token is read from
  # the CORAX_TELEGRAM_BOT_TOKEN environment variable and is NOT stored here.
  # allowed_chats is a comma-separated allow-list (empty = any chat).
  base_url: https://api.telegram.org
  allowed_chats: ""

websearch:
  # Web-search tool setup. Exported to CORAX_WEBSEARCH_* at runtime start.
  # Edit here or via the runtime menu (option "W"). base_url is the self-hosted
  # SearXNG instance (must be a local/private address, JSON format enabled).
  # engines/language/safesearch are optional defaults (empty = unset). The
  # optional proxy token is read from CORAX_WEBSEARCH_TOKEN and is NOT stored here.
  base_url: http://192.168.0.14:8080
  engines: ""
  language: ""
  safesearch: ""
